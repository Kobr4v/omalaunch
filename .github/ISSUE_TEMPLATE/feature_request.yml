name: Feature request
description: An idea worth building
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who hits it, and how often? Concrete beats abstract.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should happen, including keyboard/mouse interaction if UI is involved.
  - type: dropdown
    id: scope
    attributes:
      label: Scope check
      description: omalaunch is offline, local-first, keyboard-first. Network features, controllers, and streaming are out of scope.
      options:
        - Fits: offline, local-first, keyboard-first
        - Needs discussion (explain below)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try, and why wasn't it enough?
