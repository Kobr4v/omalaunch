name: Bug report
description: Something broken or wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in everything you can — logs beat guesses.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
      placeholder: Double-clicked Foo.AppImage, expected the Add dialog, got nothing.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Exact steps, ideally starting from a clean state.
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs and terminal output
      description: Paste `omalaunch` terminal output or relevant lines. Redact personal paths if you like.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `omalaunch --version` (or commit hash for dev builds).
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Distro, desktop/compositor, GTK version, theme in use.
      placeholder: Omarchy, Hyprland, tokyo-night
